name: mouhassaba

# Local infrastructure credentials are generated here (dev only); they are not
# external secrets. There are no third-party credentials in this project yet, so
# nothing is read from /run/base44/app.env.

x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://mouhassaba:mouhassaba_dev@db:5432/mouhassaba
  DEFAULT_TAP_RATE: "0.015"

x-python-service: &python-service
  image: python:3.12-slim
  working_dir: /app
  volumes:
    - ./backend:/app

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: mouhassaba
      POSTGRES_PASSWORD: mouhassaba_dev
      POSTGRES_DB: mouhassaba
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mouhassaba -d mouhassaba"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies the versioned SQL migrations, then exits.
  migrate:
    <<: *python-service
    environment: *api-env
    command:
      - sh
      - -ec
      - pip install --no-cache-dir -q -r requirements.txt && exec python -m scripts.migrate
    depends_on:
      db:
        condition: service_healthy

  # One-shot: loads the demo company (idempotent), then exits.
  seed:
    <<: *python-service
    environment: *api-env
    command:
      - sh
      - -ec
      - pip install --no-cache-dir -q -r requirements.txt && exec python -m scripts.seed
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *python-service
    restart: on-failure
    environment: *api-env
    ports:
      - "3000:3000"
    command:
      - sh
      - -ec
      - >-
        pip install --no-cache-dir -q -r requirements.txt &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 3000
        --reload --reload-dir /app/app --reload-dir /app/scripts
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:3000/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    labels:
      base44.project: "MouHassaBa API"
      base44.kind: "api"
      base44.port: "3000"
      base44.docs: "/docs"

volumes:
  db-data:
